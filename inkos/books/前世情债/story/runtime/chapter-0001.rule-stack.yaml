layers:
  - id: L1
    name: hard_facts
    precedence: 100
    scope: global
  - id: L2
    name: author_intent
    precedence: 80
    scope: book
  - id: L3
    name: planning
    precedence: 60
    scope: arc
  - id: L4
    name: current_task
    precedence: 70
    scope: local
sections:
  hard:
    - story_frame
    - current_state
    - book_rules
    - roles
  soft:
    - author_intent
    - current_focus
    - volume_map
  diagnostic:
    - anti_ai_checks
    - continuity_audit
    - style_regression_checks
overrideEdges:
  - from: L4
    to: L3
    allowed: true
    scope: current_chapter
  - from: L4
    to: L2
    allowed: false
    scope: current_chapter
  - from: L4
    to: L1
    allowed: false
    scope: current_chapter
activeOverrides:
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁出现同质资源重复吞噬不衰减的情况，必须带入公式结算
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁主角为了推剧情突然心软放过看见他真面目的敌人
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁使用“暴涨”“海量”等模糊词汇跳过数值结算
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁反派像木桩一样排队送死，必须有战术试探和逃跑逻辑
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁无铺垫的能力觉醒，任何底牌必须付出等价代价（如寿元、五感、记忆、道心裂纹）
  - from: L4
    to: L3
    target: chapter:1/mustAvoid
    reason: 严禁所有女角色使用同一种疯批模板，需严格区分占有、掠夺、赎罪、算计等类型
